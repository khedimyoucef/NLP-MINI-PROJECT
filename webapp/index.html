<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Children Story Generator</title>
  </head>
  <body>
    <h1>Children Story Generator</h1>
    <p>Open this page from the API server at http://localhost:8000/</p>
    <form id="gen">
      <label>Theme: <input id="theme" /></label><br/>
      <label>Age group:
        <select id="age">
          <option>Age3-4</option>
          <option>Age5-6</option>
          <option>Age7-8</option>
          <option>Age9-10</option>
          <option>Age11-12</option>
        </select>
      </label>
      <label>Max tokens: <input id="max_tokens" type="number" value="300" min="50" max="800" /></label>
      <button type="submit">Generate</button>
    </form>
    <pre id="out"></pre>
    <script>
      document.getElementById('gen').addEventListener('submit', async e =>{
        e.preventDefault();
        const theme = document.getElementById('theme').value;
        const age = document.getElementById('age').value;
        const maxTokens = parseInt(document.getElementById('max_tokens').value || '300', 10);
        const res = await fetch('/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({theme, age_group: age, max_new_tokens: maxTokens})});
        const j = await res.json();
        document.getElementById('out').textContent = j.text;
      });
    </script>
  </body>
</html>
