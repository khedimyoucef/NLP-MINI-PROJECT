<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Children Story Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f3efe6;
        --ink: #1b1b1f;
        --muted: #585861;
        --accent: #1f5b4d;
        --accent-2: #e98d5c;
        --card: #ffffff;
        --border: #d8d2c7;
        --shadow: 0 20px 40px rgba(21, 21, 24, 0.12);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at top left, #fff7e9 0%, var(--bg) 40%, #efe7d8 100%);
        min-height: 100vh;
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 24px 64px;
        display: grid;
        gap: 28px;
      }

      .hero {
        display: grid;
        gap: 16px;
        align-items: center;
      }

      .hero h1 {
        font-family: "Fraunces", serif;
        font-size: clamp(2.2rem, 4vw, 3.6rem);
        margin: 0;
        letter-spacing: -0.02em;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        max-width: 680px;
      }

      .layout {
        display: grid;
        gap: 24px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #f7efe3;
        color: var(--accent);
        font-weight: 600;
        font-size: 0.85rem;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }

      input, select, textarea {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 1rem;
        font-family: inherit;
        background: #fbfaf8;
      }

      textarea {
        resize: none;
        overflow: hidden;
        min-height: 48px;
        line-height: 1.5;
      }

      .controls {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      button {
        padding: 12px 18px;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        box-shadow: 0 12px 24px rgba(31, 91, 77, 0.25);
      }

      button.secondary {
        background: #efe8da;
        color: var(--ink);
        box-shadow: none;
        border: 1px solid var(--border);
      }

      button:hover {
        transform: translateY(-1px);
        background: #1a4e41;
      }

      button.secondary:hover:not(:disabled) {
        background: #e7dcc9;
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .output {
        min-height: 220px;
        white-space: pre-wrap;
        font-size: 1rem;
        line-height: 1.6;
        color: #222225;
      }

      .spark {
        height: 6px;
        width: 80px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      .footer {
        color: var(--muted);
        font-size: 0.9rem;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .card, .hero {
        animation: fadeUp 0.6s ease both;
      }

      .hero { animation-delay: 0.05s; }
      .card:first-of-type { animation-delay: 0.15s; }
      .card:last-of-type { animation-delay: 0.25s; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero">
        <span class="badge">CPU-friendly demo</span>
        <h1>Children Story Generator</h1>
        <div class="spark"></div>
        <p>Give a theme and pick an age level. The model adapts vocabulary and sentence length to the selected age group.</p>
      </div>

      <div class="layout">
        <div class="card">
          <form id="gen">
            <label>
              Theme
              <textarea id="theme" placeholder="a brave mouse who loves music" required></textarea>
            </label>
            <label>
              Model
              <select id="model_name">
                <option value="story-gpt2">story-gpt2</option>
                <option value="gpt2-xl">gpt2-xl</option>
              </select>
              <div id="model_status" style="font-size: 0.85rem; color: var(--muted); margin-top: 4px; font-weight: normal;">Loading models...</div>
            </label>
            <div class="controls">
              <label>
                Age group
                <select id="age">
                  <option>Age3-4</option>
                  <option>Age5-6</option>
                  <option>Age7-8</option>
                  <option>Age9-10</option>
                  <option>Age11-12</option>
                </select>
              </label>
              <label>
                Max tokens
                <input id="max_tokens" type="number" value="300" min="50" max="800" />
              </label>
            </div>
            <label style="display: flex; flex-direction: row; align-items: center; gap: 8px; font-weight: normal; font-size: 0.95rem; margin-bottom: 8px; cursor: pointer;">
              <input id="show_thinking" type="checkbox" checked style="width: auto; transform: scale(1.2);" /> Show Model Thinking Process
            </label>
            <div class="controls">
              <button id="submitBtn" type="submit">Generate story</button>
              <button id="stopBtn" type="button" class="secondary" disabled>Stop generation</button>
            </div>
          </form>
        </div>

        <div class="card">
          <h3>Story</h3>
          <div id="think-out" class="output" style="display: none; background: #f8faee; border-left: 4px solid var(--accent); padding: 16px; margin-bottom: 16px; font-style: italic; color: #505540; font-size: 0.9rem; border-radius: 4px; min-height: auto;"></div>
          <div id="out" class="output">Your story will appear here.</div>
        </div>
      </div>

      <div class="footer">Open this UI from the API server at http://localhost:8000/</div>
    </div>

    <script>
      const form = document.getElementById('gen');
      const out = document.getElementById('out');
      const btn = document.getElementById('submitBtn');
      const stopBtn = document.getElementById('stopBtn');
      const modelSelect = document.getElementById('model_name');
      const modelStatus = document.getElementById('model_status');
      let activeAbortController = null;
      let modelSwitchInProgress = false;

      function setGenerationState(isGenerating) {
        btn.disabled = isGenerating;
        stopBtn.disabled = !isGenerating;
        modelSelect.disabled = isGenerating || modelSwitchInProgress;
        btn.textContent = isGenerating ? 'Generating...' : 'Generate story';
      }

      function setModelSwitchState(isSwitching, message) {
        modelSwitchInProgress = isSwitching;
        modelSelect.disabled = isSwitching || btn.disabled;
        modelStatus.textContent = message;
        modelStatus.style.color = isSwitching ? 'var(--muted)' : 'var(--accent)';
      }

      stopBtn.addEventListener('click', () => {
        if (activeAbortController) {
          activeAbortController.abort();
        }
      });

      async function loadAvailableModels() {
        try {
          setModelSwitchState(true, 'Loading models...');
          const res = await fetch('/models');
          if (!res.ok) throw new Error('Model list fetch failed');
          const data = await res.json();
          if (Array.isArray(data.models) && data.models.length) {
            modelSelect.innerHTML = data.models
              .map(name => {
                let label = name;
                if (name === 'story-gpt2') {
                  label = `${name} (fine-tuned GPT-2)`;
                } else if (name.startsWith('gpt2')) {
                  label = `${name} (base model)`;
                } else if (name.includes('gemma')) {
                  label = name.includes('finetuned') ? `${name} (fine-tuned Gemma GGUF)` : `${name} (Gemma GGUF)`;
                }
                return `<option value="${name}">${label}</option>`;
              })
              .join('');
            if (data.default && data.models.includes(data.default)) {
              modelSelect.value = data.default;
            }
            await activateSelectedModel(modelSelect.value, false);
          } else {
            setModelSwitchState(false, 'No models found');
            modelStatus.style.color = 'var(--muted)';
          }
        } catch (error) {
          setModelSwitchState(false, 'Failed to load model list');
          modelStatus.style.color = 'var(--muted)';
          console.warn('Could not load model list:', error);
        }
      }

      async function activateSelectedModel(modelName, showBusy = true) {
        try {
          if (showBusy) {
            setModelSwitchState(true, `Switching to ${modelName}...`);
          }
          const res = await fetch('/activate-model', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model_name: modelName })
          });
          if (!res.ok) throw new Error(`Switch failed: ${res.status}`);
          const info = await res.json();
          if (!info.model_loaded || info.model_name !== modelName) {
            throw new Error('Server reported inconsistent model state');
          }
          setModelSwitchState(false, `Loaded: ${info.model_name}`);
          return true;
        } catch (error) {
          setModelSwitchState(false, `Failed to load ${modelName}`);
          modelStatus.style.color = '#b04a3a';
          console.error('Model activation failed:', error);
          return false;
        }
      }

      loadAvailableModels();

      // Auto-grow textarea as user types
      const themeTextarea = document.getElementById('theme');
      function autoGrowTextarea() {
        themeTextarea.style.height = 'auto';
        themeTextarea.style.height = Math.max(themeTextarea.scrollHeight, 48) + 'px';
      }
      themeTextarea.addEventListener('input', autoGrowTextarea);

      modelSelect.addEventListener('change', async () => {
        if (activeAbortController) {
          activeAbortController.abort();
        }
        await activateSelectedModel(modelSelect.value, true);
      });

      form.addEventListener('submit', async e =>{
        e.preventDefault();
        const theme = document.getElementById('theme').value.trim();
        const age = document.getElementById('age').value;
        const modelName = modelSelect.value;
        const maxTokens = parseInt(document.getElementById('max_tokens').value || '300', 10);
        if (!theme) return;
        const modelReady = await activateSelectedModel(modelName, false);
        if (!modelReady) {
          out.textContent = 'Unable to switch model. Please try again.';
          return;
        }
        if (activeAbortController) {
          activeAbortController.abort();
        }
        activeAbortController = new AbortController();
        setGenerationState(true);
        out.textContent = 'Generating story...';
        try {
          const res = await fetch('/generate', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({theme, age_group: age, max_new_tokens: maxTokens, model_name: modelName}),
            signal: activeAbortController.signal
          });
          if (!res.ok) throw new Error('Generation failed');
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          out.textContent = '';
          const thinkOut = document.getElementById('think-out');
          thinkOut.style.display = 'none';
          thinkOut.textContent = '';
          const showThinking = document.getElementById('show_thinking').checked;

          while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {stream: true});
            
            let displayHtml = '';
            let thinkHtml = '';
            
            let currentStr = buffer;
            let pStart = currentStr.indexOf('<think>');
            while (pStart !== -1) {
              displayHtml += currentStr.substring(0, pStart);
              let pEnd = currentStr.indexOf('</think>', pStart + 7);
              if (pEnd !== -1) {
                thinkHtml += currentStr.substring(pStart + 7, pEnd) + '\n\n';
                currentStr = currentStr.substring(pEnd + 8);
              } else {
                thinkHtml += currentStr.substring(pStart + 7);
                currentStr = '';
                break;
              }
              pStart = currentStr.indexOf('<think>');
            }
            displayHtml += currentStr;
            
            out.textContent = displayHtml;
            if (thinkHtml.trim() && document.getElementById('show_thinking').checked) {
              thinkOut.style.display = 'block';
              thinkOut.textContent = thinkHtml.trim();
            } else {
              thinkOut.style.display = 'none';
            }
          }
        } catch (err) {
          if (err && err.name === 'AbortError') {
            out.textContent = 'Generation stopped.';
          } else {
            out.textContent = 'Failed to generate. Is the API running? ' + err;
          }
        } finally {
          activeAbortController = null;
          setGenerationState(false);
        }
      });
    </script>
  </body>
</html>
